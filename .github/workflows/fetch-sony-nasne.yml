name: Fetch latest SonyNasne-debian source ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-sony-nasne.yml"

permissions:
  contents: read
  actions: write

jobs:
  fetch-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve upstream main commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(curl -fsSL --retry 3 https://api.github.com/repos/mar1mo-41414/SonyNasne-debian/commits/main | jq -r '.sha')"
          test "${#SHA}" -eq 40
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          printf 'Upstream commit: %s\n' "$SHA"

      - name: Download and validate source archive
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            "https://github.com/mar1mo-41414/SonyNasne-debian/archive/${UPSTREAM_SHA}.zip" \
            -o SonyNasne-debian-main.zip
          unzip -t SonyNasne-debian-main.zip
          test "$(stat -c %s SonyNasne-debian-main.zip)" -gt 100000
          printf 'repository=mar1mo-41414/SonyNasne-debian\nbranch=main\ncommit=%s\narchive=SonyNasne-debian-main.zip\n' "$UPSTREAM_SHA" > SOURCE_COMMIT.txt
          sha256sum SonyNasne-debian-main.zip | tee SOURCE_SHA256.txt
          cat SOURCE_COMMIT.txt

      - name: Upload source ZIP as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sony-nasne-source
          path: |
            SonyNasne-debian-main.zip
            SOURCE_COMMIT.txt
            SOURCE_SHA256.txt
          if-no-files-found: error
          retention-days: 14
