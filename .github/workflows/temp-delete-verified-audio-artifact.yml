name: Temporary cleanup of verified recording artifact

on:
  push:
    paths:
      - ".github/workflows/temp-delete-verified-audio-artifact.yml"

permissions:
  actions: write
  contents: read

jobs:
  delete-verified-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete downloaded-and-verified source artifact from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error -o response.txt -w '%{http_code}' \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/artifacts/12241296509")"
          printf 'DELETE artifact API status: %s\n' "$status"
          if [[ "$status" != "204" && "$status" != "404" ]]; then
            cat response.txt
            exit 1
          fi
