name: FigBug Piano Audio Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/figbug-piano-audio-probe.yml"

permissions:
  contents: read

jobs:
  render-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout temporary repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build clang g++ \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev \
            libfreetype6-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Fetch FigBug Piano with submodules
        run: git clone --depth 1 --recurse-submodules https://github.com/FigBug/Piano.git piano-src

      - name: Add MIDI demo renderer
        shell: bash
        run: |
          cat >> piano-src/tests/CMakeLists.txt <<'CMAKE'

          # Temporary offline renderer used only by the audio-probe workflow.
          juce_add_console_app(PianoRenderDemo
              PRODUCT_NAME "Piano Render Demo"
              VERSION 1.0.0
          )
          target_sources(PianoRenderDemo PRIVATE
              render_demo.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/qiano.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/dwgs.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/hammer.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/filter.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/reverb.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/utils.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/AudioFFT.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/FFTConvolver.cpp
              ${CMAKE_SOURCE_DIR}/plugin/Source/Utilities.cpp
          )
          target_include_directories(PianoRenderDemo PRIVATE
              ${CMAKE_SOURCE_DIR}/plugin/Source
              ${CMAKE_SOURCE_DIR}/modules/fmt/include
          )
          target_link_libraries(PianoRenderDemo PRIVATE
              gin gin_dsp gin_simd
              juce::juce_audio_basics juce::juce_audio_formats
              juce::juce_core juce::juce_data_structures juce::juce_events
              juce::juce_graphics juce::juce_gui_basics
          )
          target_compile_definitions(PianoRenderDemo PRIVATE
              JUCE_WEB_BROWSER=0 JUCE_USE_FLAC=0 JUCE_USE_CURL=0
              JUCE_USE_MP3AUDIOFORMAT=0 JUCE_USE_LAME_AUDIO_FORMAT=0
              JUCE_USE_WINDOWS_MEDIA_FORMAT=0 DONT_SET_USING_JUCE_NAMESPACE=1
          )
          juce_generate_juce_header(PianoRenderDemo)
          CMAKE

          cat > piano-src/tests/render_demo.cpp <<'CPP'
          #include <JuceHeader.h>
          #include "qiano.h"
          #include <algorithm>
          #include <cmath>
          #include <iostream>
          #include <memory>
          #include <vector>

          struct NoteEvent
          {
              int start;
              int end;
              int note;
              int velocity;
          };

          int main(int argc, char** argv)
          {
              juce::ScopedJuceInitialiser_GUI juceInit;
              constexpr double sampleRate = 44100.0;
              constexpr int blockSize = 256;
              constexpr double duration = 14.0;
              const int totalSamples = static_cast<int>(sampleRate * duration);
              const juce::String outputPath = argc > 1 ? argv[1] : "FigBug-Piano-demo.wav";

              // A short original phrase followed by chord voicings; all events are sent as MIDI.
              std::vector<NoteEvent> notes;
              auto addNote = [&](double start, double end, int pitch, int velocity)
              {
                  notes.push_back({static_cast<int>(start * sampleRate),
                                   static_cast<int>(end * sampleRate), pitch, velocity});
              };

              const int melody[] = {60, 64, 67, 72, 71, 67, 69, 65, 64, 60, 62, 67, 64, 60};
              for (int i = 0; i < 14; ++i)
              {
                  const double start = 0.45 + i * 0.42;
                  addNote(start, start + 0.34, melody[i], (i % 4 == 0) ? 86 : 70);
              }

              // A slower progression lets the listener hear low notes, chords, and decays.
              const int roots[] = {48, 45, 41, 43, 48};
              for (int c = 0; c < 5; ++c)
              {
                  const double start = 7.0 + c * 1.05;
                  const int root = roots[c];
                  addNote(start, start + 0.78, root, 76);
                  addNote(start, start + 0.78, root + ((c == 1 || c == 2) ? 3 : 4), 69);
                  addNote(start, start + 0.78, root + 7, 72);
                  addNote(start, start + 0.78, root + 12, 58);
              }

              Piano piano;
              piano.init(static_cast<float>(sampleRate), blockSize);
              for (int i = 0; i < NumParams; ++i)
                  piano.setParameter(i, 0.5f);
              piano.setParameter(pVolume, 0.7f);

              juce::AudioBuffer<float> audio(2, totalSamples);
              audio.clear();

              for (int pos = 0; pos < totalSamples; pos += blockSize)
              {
                  const int count = std::min(blockSize, totalSamples - pos);
                  juce::MidiBuffer midi;
                  const int blockEnd = pos + count;
                  for (const auto& n : notes)
                  {
                      if (n.start >= pos && n.start < blockEnd)
                          midi.addEvent(juce::MidiMessage::noteOn(1, n.note,
                              static_cast<juce::uint8>(n.velocity)), n.start - pos);
                      if (n.end >= pos && n.end < blockEnd)
                          midi.addEvent(juce::MidiMessage::noteOff(1, n.note), n.end - pos);
                  }
                  float* channels[] = {audio.getWritePointer(0, pos), audio.getWritePointer(1, pos)};
                  piano.process(channels, count, midi);
              }

              const float peak = audio.getMagnitude(0, totalSamples);
              double sumSquares = 0.0;
              for (int i = 0; i < totalSamples; ++i)
                  sumSquares += static_cast<double>(audio.getSample(0, i)) * audio.getSample(0, i);
              const double rms = std::sqrt(sumSquares / totalSamples);
              if (!std::isfinite(peak) || peak < 1.0e-5f)
              {
                  std::cerr << "Renderer produced silence or invalid audio; peak=" << peak << "\n";
                  return 2;
              }

              juce::File file(outputPath);
              file.getParentDirectory().createDirectory();
              juce::WavAudioFormat wav;
              std::unique_ptr<juce::FileOutputStream> stream(file.createOutputStream());
              if (!stream)
              {
                  std::cerr << "Could not create output file: " << file.getFullPathName() << "\n";
                  return 3;
              }
              std::unique_ptr<juce::AudioFormatWriter> writer(
                  wav.createWriterFor(stream.get(), sampleRate, 2, 24, {}, 0));
              if (!writer)
              {
                  std::cerr << "Could not create WAV writer\n";
                  return 4;
              }
              stream.release(); // writer owns the stream
              if (!writer->writeFromAudioSampleBuffer(audio, 0, totalSamples))
              {
                  std::cerr << "Failed to write WAV\n";
                  return 5;
              }

              std::cout << "Output: " << file.getFullPathName() << "\n"
                        << "Sample rate: " << sampleRate << " Hz\n"
                        << "Duration: " << duration << " s\n"
                        << "Channels: 2, PCM 24-bit\n"
                        << "Peak: " << peak << ", RMS: " << rms << "\n";
              return 0;
          }
          CPP

      - name: Configure
        working-directory: piano-src
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DENABLE_ASAN=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Build renderer
        working-directory: piano-src
        run: cmake --build build --target PianoRenderDemo --config Release

      - name: Render audio
        run: |
          mkdir -p artifacts
          xvfb-run --auto-servernum ./piano-src/build/tests/PianoRenderDemo_artefacts/Release/PianoRenderDemo "$GITHUB_WORKSPACE/artifacts/FigBug-Piano-physical-model-demo.wav"
          file artifacts/FigBug-Piano-physical-model-demo.wav
          ls -lh artifacts/FigBug-Piano-physical-model-demo.wav

      - name: Upload rendered WAV
        uses: actions/upload-artifact@v4
        with:
          name: FigBug-Piano-physical-model-demo
          path: artifacts/FigBug-Piano-physical-model-demo.wav
          if-no-files-found: error
          retention-days: 14
