name: Temporary fetch of licensed piano recording

on:
  push:
    paths:
      - ".github/workflows/temp-fetch-gnossienne.yml"

permissions:
  contents: read

jobs:
  fetch-recording:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download public recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          URL='https://commons.wikimedia.org/wiki/Special:Redirect/file/Gnossienne_2_%28Satie%29.ogg'
          curl --fail --location --retry 3 --retry-all-errors \
            --user-agent 'PianoSourceReconstruction research test (public file download)' \
            "$URL" -o artifact/Gnossienne_2_Satie.ogg
          test "$(stat -c %s artifact/Gnossienne_2_Satie.ogg)" -eq 1673037
          test "$(head -c 4 artifact/Gnossienne_2_Satie.ogg)" = 'OggS'
          printf '%s  %s\n' \
            '38ae316c66b914989398d2dbba6792e731592d28' \
            'artifact/Gnossienne_2_Satie.ogg' | sha1sum --check -
          sha256sum artifact/Gnossienne_2_Satie.ogg | tee artifact/SHA256SUMS.txt
          cat > artifact/ATTRIBUTION.txt <<'EOF'
          Recording: Gnossienne No. 2 by Erik Satie, performed by La Pianista
          Performer / uploader: La Pianista
          Performance date stated on source page: 2010-11-16
          Source: https://commons.wikimedia.org/wiki/File:Gnossienne_2_(Satie).ogg
          Direct source: https://commons.wikimedia.org/wiki/Special:Redirect/file/Gnossienne_2_%28Satie%29.ogg
          Performance license: Creative Commons Attribution-ShareAlike 3.0 Unported (CC BY-SA 3.0)
          Composition: marked public domain on the source page
          This copy is downloaded unchanged. Further modified outputs must retain appropriate attribution and comply with the source license.
          Integrity checks: expected byte count 1673037; source SHA-1 38ae316c66b914989398d2dbba6792e731592d28; SHA-256 recorded in SHA256SUMS.txt.
          EOF
          printf '\nDownloaded file metadata:\n'
          file artifact/Gnossienne_2_Satie.ogg
          stat -c 'bytes=%s' artifact/Gnossienne_2_Satie.ogg

      - name: Upload temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: temporary-gnossienne-recording
          path: artifact/
          if-no-files-found: error
          retention-days: 1
