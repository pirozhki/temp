name: TEMP fetch ONNX Runtime 1.21.0 Linux x64
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fetch-onnxruntime-1.21.0.yml"
permissions:
  contents: read
jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official release asset and verify package layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          url="https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz"
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o out/onnxruntime-linux-x64-1.21.0.tgz
          actual_size="$(stat -c '%s' out/onnxruntime-linux-x64-1.21.0.tgz)"
          test "$actual_size" = "7585530"
          tar -tzf out/onnxruntime-linux-x64-1.21.0.tgz > out/archive-members.txt
          mkdir -p extracted
          tar -xzf out/onnxruntime-linux-x64-1.21.0.tgz -C extracted
          root="extracted/onnxruntime-linux-x64-1.21.0"
          test -s "$root/include/onnxruntime_cxx_api.h"
          test -s "$root/include/onnxruntime/core/session/onnxruntime_c_api.h"
          test -s "$root/lib/libonnxruntime.so.1.21.0"
          grep -q "include/onnxruntime_cxx_api.h" out/archive-members.txt
          sha256sum out/onnxruntime-linux-x64-1.21.0.tgz > out/SHA256SUMS
          {
            echo "source=https://github.com/microsoft/onnxruntime/releases/tag/v1.21.0"
            echo "asset=$url"
            echo "tag=v1.21.0"
            echo "filename=onnxruntime-linux-x64-1.21.0.tgz"
            echo "expected_release_asset_size=7585530"
            echo "actual_size_bytes=$actual_size"
            echo "archive_entries=$(wc -l < out/archive-members.txt)"
            echo "header_onnxruntime_cxx_api=present"
            echo "header_onnxruntime_c_api=present"
            echo "library_libonnxruntime_so_1_21_0=present"
            echo "sha256=$(cut -d' ' -f1 out/SHA256SUMS)"
            echo "verified_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/verification-manifest.txt
      - name: Upload verified asset and provenance
        uses: actions/upload-artifact@v4
        with:
          name: temp-onnxruntime-linux-x64-1.21.0
          path: |
            out/onnxruntime-linux-x64-1.21.0.tgz
            out/SHA256SUMS
            out/verification-manifest.txt
            out/archive-members.txt
          if-no-files-found: error
          retention-days: 1
