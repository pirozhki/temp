name: TEMP fetch ONNX Runtime 1.21.0 and dlshogi source
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fetch-onnxruntime-1.21.0.yml"
permissions:
  contents: read
jobs:
  fetch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch and verify pinned official public assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out ort-extracted source-extracted
          ort_url="https://github.com/microsoft/onnxruntime/releases/download/v1.21.0/onnxruntime-linux-x64-1.21.0.tgz"
          src_url="https://github.com/TadaoYamaoka/DeepLearningShogi/archive/0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip"
          curl --fail --location --retry 3 --retry-delay 2 "$ort_url" -o out/onnxruntime-linux-x64-1.21.0.tgz
          curl --fail --location --retry 3 --retry-delay 2 "$src_url" -o out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip
          test "$(stat -c '%s' out/onnxruntime-linux-x64-1.21.0.tgz)" = "7585530"
          gzip -t out/onnxruntime-linux-x64-1.21.0.tgz
          unzip -t out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip
          tar -tzf out/onnxruntime-linux-x64-1.21.0.tgz > out/onnxruntime-archive-members.txt
          tar -xzf out/onnxruntime-linux-x64-1.21.0.tgz -C ort-extracted
          unzip -Z1 out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip > out/dlshogi-archive-members.txt
          unzip -oq out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip -d source-extracted
          ort_root="ort-extracted/onnxruntime-linux-x64-1.21.0"
          test -s "$ort_root/include/onnxruntime_cxx_api.h"
          test -s "$ort_root/include/onnxruntime_c_api.h"
          test -s "$ort_root/lib/libonnxruntime.so.1.21.0"
          grep -q '/usi_onnxruntime/Makefile$' out/dlshogi-archive-members.txt
          grep -q '/usi_onnxruntime/nn_onnxruntime.cpp$' out/dlshogi-archive-members.txt
          grep -q '/LICENSE$' out/dlshogi-archive-members.txt
          find ort-extracted -type f \( -name 'onnxruntime_cxx_api.h' -o -name 'onnxruntime_c_api.h' -o -name 'libonnxruntime.so*' \) -print | sort > out/onnxruntime-required-files.txt
          sha256sum out/onnxruntime-linux-x64-1.21.0.tgz out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip > out/SHA256SUMS
          {
            echo "onnxruntime_source=https://github.com/microsoft/onnxruntime/releases/tag/v1.21.0"
            echo "onnxruntime_asset=$ort_url"
            echo "onnxruntime_expected_size_bytes=7585530"
            echo "onnxruntime_actual_size_bytes=$(stat -c '%s' out/onnxruntime-linux-x64-1.21.0.tgz)"
            echo "dlshogi_source=https://github.com/TadaoYamaoka/DeepLearningShogi"
            echo "dlshogi_commit=0cc16854474ab3c7c4f7be66c624f9f9001f7543"
            echo "dlshogi_source_asset=$src_url"
            echo "dlshogi_source_size_bytes=$(stat -c '%s' out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip)"
            echo "onnxruntime_archive_entries=$(wc -l < out/onnxruntime-archive-members.txt)"
            echo "dlshogi_archive_entries=$(wc -l < out/dlshogi-archive-members.txt)"
            echo "verified_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > out/verification-manifest.txt
          cat out/SHA256SUMS
          cat out/verification-manifest.txt
      - name: Upload verified assets and provenance
        uses: actions/upload-artifact@v4
        with:
          name: temp-onnxruntime-1.21.0-dlshogi-source-pinned
          path: |
            out/onnxruntime-linux-x64-1.21.0.tgz
            out/dlshogi-0cc16854474ab3c7c4f7be66c624f9f9001f7543.zip
            out/SHA256SUMS
            out/verification-manifest.txt
            out/onnxruntime-archive-members.txt
            out/dlshogi-archive-members.txt
            out/onnxruntime-required-files.txt
          if-no-files-found: error
          retention-days: 1
