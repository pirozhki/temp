name: Extract Suisho5 for local build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-suisho5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract Suisho5 network
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y 7zip
          mkdir extracted handoff
          7z x Suisho5.7z -oextracted -y
          model="$(find extracted -type f -name nn.bin -print -quit)"
          test -n "$model"
          cp "$model" handoff/nn.bin
          cp YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip handoff/
          sha256sum handoff/nn.bin handoff/YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip > handoff/SHA256SUMS.txt
          printf 'Source revision: eb2856f91e6088e5b8c1216e3d84d0563f7cd85f\nExtracted model: nn.bin\n' > handoff/README-HANDOFF.txt
          cat handoff/SHA256SUMS.txt
          ls -lh handoff

      - name: Upload extracted setup files
        uses: actions/upload-artifact@v4
        with:
          name: Suisho5-local-build-inputs
          path: handoff/
          if-no-files-found: error
          retention-days: 7
