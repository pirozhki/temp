name: Temporary Suisho5 PSV sample

on:
  push:
    paths:
      - ".github/workflows/fetch-suisho5-psv-sample.yml"

permissions:
  contents: read
  actions: write

jobs:
  fetch-sample:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve immutable Hugging Face dataset revision
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re, urllib.request
          repo = "SH11235/tanuki-2024-07-30-1-qsearch-suisho5"
          headers = {"User-Agent": "SimpleShogiEngine-dataset-fetch/1.0"}
          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          revision_info = get_json(f"https://huggingface.co/api/datasets/{repo}/revision/main")
          revision = revision_info.get("sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", revision):
              raise SystemExit(f"Unexpected dataset revision SHA: {revision!r}")
          tree = get_json(f"https://huggingface.co/api/datasets/{repo}/tree/{revision}/data?expand=true")
          entry = next((item for item in tree if item.get("path") == "data/shard_000.psv"), None)
          if entry is None:
              raise SystemExit("Hugging Face API did not return data/shard_000.psv")
          expected_size = 7_280_000_000
          if int(entry.get("size", -1)) != expected_size:
              raise SystemExit(f"Unexpected shard size in metadata: {entry.get('size')!r}")
          lfs = entry.get("lfs") or {}
          oid = str(lfs.get("oid", ""))
          published_sha = oid.removeprefix("sha256:").lower()
          if not re.fullmatch(r"[0-9a-f]{64}", published_sha):
              published_sha = ""
          xet_hash = str(entry.get("xetHash") or entry.get("xet_hash") or "")
          metadata = {
              "repository": repo,
              "revision": revision,
              "file_path": "data/shard_000.psv",
              "file_size_bytes": expected_size,
              "published_lfs_sha256": published_sha or None,
              "xet_hash_if_reported_by_api": xet_hash or None,
              "license": "MIT",
          }
          with open("source-metadata.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"revision={revision}")
          print(f"source_size={expected_size}")
          print(f"published_sha256={published_sha}")
          PY
          cat source-metadata.json

      - name: Obtain reproducible 2,000,000-record sample
        id: sample
        env:
          DATASET_REVISION: ${{ steps.meta.outputs.revision }}
          EXPECTED_SIZE: ${{ steps.meta.outputs.source_size }}
          PUBLISHED_SHA256: ${{ steps.meta.outputs.published_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          URL="https://huggingface.co/datasets/SH11235/tanuki-2024-07-30-1-qsearch-suisho5/resolve/${DATASET_REVISION}/data/shard_000.psv"
          SAMPLE_BYTES=80000000
          EXPECTED_TOTAL="$EXPECTED_SIZE"
          RANGE_OK=0

          # Try to fetch only the required byte range. The source is already
          # shuffled by its publisher; 2,000,000 records occupy exactly 80 MB.
          if curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
              --range "0-$((SAMPLE_BYTES - 1))" --max-filesize "$SAMPLE_BYTES" \
              --dump-header /tmp/hf-range-headers.txt "$URL" \
              --output out/sample.psv; then
            if [ "$(stat -c %s out/sample.psv)" = "$SAMPLE_BYTES" ] && \
               grep -Eiq "^content-range:[[:space:]]*bytes 0-79999999/${EXPECTED_TOTAL}[[:space:]]*\r?$" /tmp/hf-range-headers.txt; then
              RANGE_OK=1
            fi
          fi

          if [ "$RANGE_OK" -eq 1 ]; then
            echo "source_mode=range" >> "$GITHUB_OUTPUT"
          else
            echo "Range request was not honored; falling back to a full temporary download." >&2
            rm -f out/sample.psv /tmp/hf-range-headers.txt /tmp/shard_000.psv
            curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
              --connect-timeout 30 --output /tmp/shard_000.psv "$URL"
            ACTUAL_SIZE="$(stat -c %s /tmp/shard_000.psv)"
            [ "$ACTUAL_SIZE" = "$EXPECTED_TOTAL" ] || {
              echo "Full shard size mismatch: expected $EXPECTED_TOTAL, got $ACTUAL_SIZE" >&2
              exit 1
            }
            sha256sum /tmp/shard_000.psv > out/source-shard.sha256
            ACTUAL_SHA="$(cut -d ' ' -f1 out/source-shard.sha256)"
            if [ -n "$PUBLISHED_SHA256" ] && [ "$ACTUAL_SHA" != "$PUBLISHED_SHA256" ]; then
              echo "Published shard SHA-256 mismatch" >&2
              exit 1
            fi
            head -c "$SAMPLE_BYTES" /tmp/shard_000.psv > out/sample.psv
            echo "source_mode=full_download_and_verified" >> "$GITHUB_OUTPUT"
          fi

          [ "$(stat -c %s out/sample.psv)" = "$SAMPLE_BYTES" ]
          echo "sample_bytes=$SAMPLE_BYTES" >> "$GITHUB_OUTPUT"
          rm -f /tmp/hf-range-headers.txt /tmp/shard_000.psv source-metadata.json.tmp

      - name: Validate PSV layout and write manifest
        env:
          DATASET_REVISION: ${{ steps.meta.outputs.revision }}
          EXPECTED_SIZE: ${{ steps.meta.outputs.source_size }}
          PUBLISHED_SHA256: ${{ steps.meta.outputs.published_sha256 }}
          SOURCE_MODE: ${{ steps.sample.outputs.source_mode }}
        shell: bash
        run: |
          set -euo pipefail
          cp source-metadata.json out/source-metadata.json
          python - <<'PY'
          import collections, hashlib, json, mmap, os, pathlib, struct
          out = pathlib.Path("out")
          sample = out / "sample.psv"
          metadata = json.loads((out / "source-metadata.json").read_text(encoding="utf-8"))
          record_size = 40
          expected_records = 2_000_000
          expected_bytes = record_size * expected_records
          size = sample.stat().st_size
          if size != expected_bytes or size % record_size:
              raise SystemExit(f"PSV size/record alignment mismatch: {size}")
          sha = hashlib.sha256()
          with sample.open("rb") as f:
              for chunk in iter(lambda: f.read(4 * 1024 * 1024), b""):
                  sha.update(chunk)
          result_counts = collections.Counter()
          scores_min, scores_max, score_sum = 32767, -32768, 0
          with sample.open("rb") as f, mmap.mmap(f.fileno(), 0, access=mmap.ACCESS_READ) as mm:
              for offset in range(0, size, record_size):
                  score = struct.unpack_from("<h", mm, offset + 32)[0]
                  game_result = struct.unpack_from("<b", mm, offset + 38)[0]
                  if game_result not in (-1, 0, 1):
                      raise SystemExit(f"Unexpected game_result {game_result} at record {offset // record_size}")
                  scores_min = min(scores_min, score)
                  scores_max = max(scores_max, score)
                  score_sum += score
                  result_counts[str(game_result)] += 1
          sample_sha = sha.hexdigest()
          source_sha = None
          source_sha_file = out / "source-shard.sha256"
          if source_sha_file.exists():
              source_sha = source_sha_file.read_text(encoding="ascii").split()[0]
          manifest = {
              "schema_version": 1,
              "dataset": metadata["repository"],
              "dataset_revision": metadata["revision"],
              "source_file": metadata["file_path"],
              "source_file_size_bytes": metadata["file_size_bytes"],
              "source_published_lfs_sha256": metadata.get("published_lfs_sha256"),
              "source_sha256_computed_if_full_download": source_sha,
              "source_retrieval_mode": os.environ["SOURCE_MODE"],
              "sample_method": "first 2,000,000 records of publisher-shuffled shard_000; bytes copied unchanged",
              "record_format": "YaneuraOu PackedSfenValue (PSV), little-endian, 40 bytes",
              "record_count": expected_records,
              "sample_size_bytes": size,
              "sample_sha256": sample_sha,
              "score_offset": 32,
              "score_type": "signed int16 centipawns, side-to-move view",
              "game_result_offset": 38,
              "game_result_counts": dict(sorted(result_counts.items())),
              "score_min_cp": scores_min,
              "score_max_cp": scores_max,
              "score_mean_cp": score_sum / expected_records,
              "license": "MIT",
              "notes": [
                  "The dataset is pinned to an immutable Hugging Face commit revision.",
                  "If range retrieval succeeded, the complete 7.28 GB source shard was not downloaded; only the 80,000,000-byte sample was verified and hashed.",
                  "No source records were converted or rewritten.",
              ],
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (out / "README.txt").write_text(
              "Suisho5 qsearch PSV 2,000,000-record sample\n"
              "Source repository: " + metadata["repository"] + "\n"
              "Pinned revision: " + metadata["revision"] + "\n"
              "Records: 2,000,000\nRecord size: 40 bytes\n"
              "Sample SHA-256: " + sample_sha + "\n"
              "See manifest.json for provenance and validation details.\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, ensure_ascii=False))
          PY
          rm -f out/source-metadata.json.tmp

      - name: Upload sample artifact (small, short-lived)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: suisho5-psv-sample-2m
          path: |
            out/sample.psv
            out/manifest.json
            out/README.txt
            out/source-shard.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Delete artifact after retrieval window
        if: ${{ always() && steps.upload.outputs.artifact-id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Artifact is available for 20 minutes so it can be retrieved and verified."
          sleep 1200
          curl --fail --silent --show-error --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
