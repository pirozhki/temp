name: Package Suisho5 setup inputs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/package-suisho5-inputs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package source and evaluation-function archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout temporary repository
        uses: actions/checkout@v4

      - name: Verify files and compute checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s "Suisho5.7z"
          test -s "YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip"
          sha256sum \
            "Suisho5.7z" \
            "YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip" \
            | tee SHA256SUMS.txt
          ls -lh "Suisho5.7z" "YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip" SHA256SUMS.txt

      - name: Upload input files as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Suisho5-setup-inputs
          path: |
            Suisho5.7z
            YaneuraOu-eb2856f91e6088e5b8c1216e3d84d0563f7cd85f.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
