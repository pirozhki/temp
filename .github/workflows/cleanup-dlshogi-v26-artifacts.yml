name: Delete temporary dlshogi v26 retrieval artifacts

on:
  push:
    paths:
      - ".github/workflows/cleanup-dlshogi-v26-artifacts.yml"

permissions:
  actions: write

jobs:
  cleanup-only-our-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Delete only the temporary artifacts created for this retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          for ID in 12299400850 12298774222 12298633569; do
            URL="https://api.github.com/repos/${REPO}/actions/artifacts/${ID}"
            CODE="$(curl -sS -o /tmp/delete-artifact.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "${URL}")"
            if [[ "${CODE}" != "204" && "${CODE}" != "404" ]]; then
              cat /tmp/delete-artifact.json
              echo "Unexpected DELETE status ${CODE} for artifact ${ID}" >&2
              exit 1
            fi
            VERIFY="$(curl -sS -o /tmp/verify-artifact.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" "${URL}")"
            if [[ "${VERIFY}" != "404" ]]; then
              echo "Artifact ${ID} still exists after cleanup (HTTP ${VERIFY})" >&2
              exit 1
            fi
            printf 'Removed/verified absent artifact %s\n' "${ID}"
          done
