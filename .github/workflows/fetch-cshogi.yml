name: Fetch cshogi CPython 3.13 Linux wheel and source

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-cshogi.yml"

permissions:
  contents: read

jobs:
  fetch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download wheel and matching source distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --dest dist \
            "cshogi==1.0.9"
          WHEEL="cshogi-1.0.9-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"
          test -f "dist/$WHEEL"
          EXPECTED="8661623699de6ab873814584d5531232a9002dc2421a446f7ca631e4afba7ae7"
          ACTUAL="$(sha256sum "dist/$WHEEL" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

          SDIST_URL="$(python - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://pypi.org/pypi/cshogi/1.0.9/json", timeout=20) as response:
              metadata = json.load(response)
          print(next(item["url"] for item in metadata["urls"] if item["packagetype"] == "sdist"))
          PY
          )"
          curl -fL --retry 3 "$SDIST_URL" -o dist/cshogi-1.0.9.tar.gz
          tar -tzf dist/cshogi-1.0.9.tar.gz >/dev/null
          tar -xOf dist/cshogi-1.0.9.tar.gz --wildcards '*/LICENSE*' >/dev/null

          cp "dist/$WHEEL" .
          cp dist/cshogi-1.0.9.tar.gz .
          sha256sum "$WHEEL" cshogi-1.0.9.tar.gz | tee SHA256SUMS.txt
          cat > README-cshogi-artifact.txt <<EOF
          Package: cshogi
          Version: 1.0.9
          Wheel target: CPython 3.13, Linux x86-64 (glibc 2.24+)
          Source: PyPI cshogi 1.0.9 source distribution
          Wheel: $WHEEL
          Source archive: cshogi-1.0.9.tar.gz
          Wheel SHA-256: $ACTUAL
          The cshogi project is GPL-3.0 licensed. The source archive is provided
          alongside the wheel for corresponding-source and reproducibility purposes.
          EOF
          cat README-cshogi-artifact.txt
          cat SHA256SUMS.txt

      - name: Upload cshogi offline package as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshogi-offline-package-py313-linux-x86_64
          path: |
            cshogi-1.0.9-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
            cshogi-1.0.9.tar.gz
            SHA256SUMS.txt
            README-cshogi-artifact.txt
          if-no-files-found: error
          retention-days: 14
