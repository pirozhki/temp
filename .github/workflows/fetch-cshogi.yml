name: Fetch cshogi CPython 3.13 Linux wheel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-cshogi.yml"

permissions:
  contents: read

jobs:
  fetch-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download the exact PyPI wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --dest dist \
            "cshogi==1.0.9"
          WHEEL="cshogi-1.0.9-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl"
          test -f "dist/$WHEEL"
          EXPECTED="8661623699de6ab873814584d5531232a9002dc2421a446f7ca631e4afba7ae7"
          ACTUAL="$(sha256sum "dist/$WHEEL" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          cp "dist/$WHEEL" .
          printf '%s  %s\n' "$ACTUAL" "$WHEEL" > SHA256SUMS.txt
          cat > README-cshogi-artifact.txt <<EOF
          Package: cshogi
          Version: 1.0.9
          Target: CPython 3.13, Linux x86-64 (glibc 2.24+)
          Source: PyPI
          Wheel: $WHEEL
          SHA-256: $ACTUAL
          Downloaded with pip download --only-binary=:all: --no-deps.
          EOF
          cat README-cshogi-artifact.txt
          cat SHA256SUMS.txt

      - name: Upload cshogi wheel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cshogi-wheel-py313-linux-x86_64
          path: |
            cshogi-1.0.9-cp313-cp313-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
            SHA256SUMS.txt
            README-cshogi-artifact.txt
          if-no-files-found: error
          retention-days: 14
